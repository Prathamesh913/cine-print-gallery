name: Notion publishing sync

# Three independent lanes:
#   - manual dry-run: always available, never writes, no activation variable;
#   - manual apply: requires AUTOMATION_MANUAL_APPLY_ENABLED, the confirmation
#     phrase and a limit of exactly 1, and runs in the protected
#     `automation-manual-apply` environment;
#   - scheduled apply: requires AUTOMATION_ENABLED and the schedule event.
#
# Enabling AUTOMATION_ENABLED therefore arms only the cron lane and never makes
# a manual dispatch writable. Enabling the manual lane never arms cron.

on:
  schedule:
    - cron: "5,25,45 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "dry-run (read-only preview) or apply (Firestore writes; requires confirmation)"
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      confirm_apply:
        description: "Required for apply: type APPLY-ONE-POSTER to authorize exactly one record"
        type: string
        default: ""
      limit:
        description: "Maximum published records processed this run (apply requires exactly 1)"
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  # Shared with Raindrop ingestion: the two workflows must never overlap.
  # This does not protect against local CLI runs or other independent runners.
  group: cineprint-catalog-automation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate dispatch inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate manual authorization
        env:
          GATE_ACTION: ${{ inputs.action }}
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_LIMIT: ${{ inputs.limit }}
          GATE_CONFIRMATION: ${{ inputs.confirm_apply }}
          GATE_ENVIRONMENT: ${{ inputs.action == 'apply' && 'automation-manual-apply' || 'automation-manual-dry-run' }}
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          GATE_MANUAL_APPLY_ENABLED: ${{ vars.AUTOMATION_MANUAL_APPLY_ENABLED }}
        run: node automation/ingestion/run-authorization.mjs dispatch

  manual-dry-run:
    name: Manual dry-run
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'dry-run'
    uses: ./.github/workflows/automation-publish-run.yml
    with:
      apply: false
      limit: ${{ inputs.limit }}
      source: manual
      confirmation: ""
      environment: automation-manual-dry-run
    secrets:
      # Read-only credentials only: a dry-run must never need write access.
      NOTION_KEY: ${{ secrets.NOTION_KEY }}

  manual-apply:
    name: Manual apply (one record)
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'apply' &&
      vars.AUTOMATION_MANUAL_APPLY_ENABLED == 'true'
    uses: ./.github/workflows/automation-publish-run.yml
    with:
      apply: true
      limit: ${{ inputs.limit }}
      source: manual
      confirmation: ${{ inputs.confirm_apply }}
      environment: automation-manual-apply
    secrets:
      NOTION_KEY: ${{ secrets.NOTION_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  scheduled:
    name: Scheduled apply
    if: github.event_name == 'schedule' && vars.AUTOMATION_ENABLED == 'true'
    uses: ./.github/workflows/automation-publish-run.yml
    with:
      apply: true
      limit: "50"
      source: schedule
      confirmation: ""
      environment: automation-scheduled
    secrets:
      NOTION_KEY: ${{ secrets.NOTION_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
