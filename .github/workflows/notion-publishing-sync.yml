name: Notion publishing sync

# Three independent lanes:
#   - manual dry-run: always available, never writes, no activation variable;
#   - manual apply: requires AUTOMATION_MANUAL_APPLY_ENABLED, the confirmation
#     phrase, a limit of exactly 1 and the default branch. It intentionally does
#     not use a GitHub Environment reviewer: editorial approval happens once, in
#     Notion, when a Draft is moved to Published;
#   - scheduled apply: requires AUTOMATION_PUBLISHING_ENABLED and the schedule
#     event.
#
# Enabling AUTOMATION_PUBLISHING_ENABLED therefore arms only the publishing cron
# lane. It never makes a manual dispatch writable, and it does not arm the
# ingestion cron lane, which has its own AUTOMATION_INGESTION_ENABLED switch.
# Enabling the manual lane never arms cron.

on:
  schedule:
    - cron: "5,25,45 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "dry-run (read-only preview) or apply (Firestore writes; requires confirmation)"
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      confirm_apply:
        description: "Required for apply: type APPLY-ONE-POSTER to authorize exactly one record"
        type: string
        default: ""
      limit:
        description: "Maximum published records processed this run (apply requires exactly 1)"
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  # Shared with Raindrop ingestion: the two workflows must never overlap.
  # This does not protect against local CLI runs or other independent runners.
  group: cineprint-catalog-automation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate dispatch inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate manual authorization
        env:
          GATE_ACTION: ${{ inputs.action }}
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_LIMIT: ${{ inputs.limit }}
          GATE_CONFIRMATION: ${{ inputs.confirm_apply }}
          GATE_REF: ${{ github.ref }}
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          GATE_MANUAL_APPLY_ENABLED: ${{ vars.AUTOMATION_MANUAL_APPLY_ENABLED }}
        run: node automation/ingestion/run-authorization.mjs dispatch

  manual-dry-run:
    name: Manual dry-run
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'dry-run'
    uses: ./.github/workflows/automation-publish-run.yml
    with:
      apply: false
      limit: ${{ inputs.limit }}
      source: manual
      confirmation: ""
    secrets:
      # Read-only credentials: NOTION_KEY can only query, and the Firestore
      # adapters are wrapped so a dry-run cannot write.
      NOTION_KEY: ${{ secrets.NOTION_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  manual-apply:
    name: Manual apply (one record)
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'apply' &&
      vars.AUTOMATION_MANUAL_APPLY_ENABLED == 'true'
    uses: ./.github/workflows/automation-publish-run.yml
    with:
      apply: true
      limit: ${{ inputs.limit }}
      source: manual
      confirmation: ${{ inputs.confirm_apply }}
    secrets:
      NOTION_KEY: ${{ secrets.NOTION_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  scheduled:
    name: Scheduled apply
    if: github.event_name == 'schedule' && vars.AUTOMATION_PUBLISHING_ENABLED == 'true'
    uses: ./.github/workflows/automation-publish-run.yml
    with:
      apply: true
      limit: "50"
      source: schedule
      confirmation: ""
      scheduled-gate: AUTOMATION_PUBLISHING_ENABLED
      scheduled-enabled: ${{ vars.AUTOMATION_PUBLISHING_ENABLED }}
    secrets:
      NOTION_KEY: ${{ secrets.NOTION_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
