name: Notion publishing sync (run)

# Reusable run body. Callers own the activation gates and the environment.
# This workflow re-checks the resolved authorization before installing
# dependencies or exposing any credential to a step.

on:
  workflow_call:
    inputs:
      apply:
        description: "Perform Firestore writes (authorized by the caller)"
        required: true
        type: boolean
      limit:
        description: "Maximum published records processed this run"
        required: true
        type: string
      source:
        description: "manual or schedule"
        required: true
        type: string
      confirmation:
        description: "Manual apply confirmation phrase"
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub Environment that scopes this run"
        required: true
        type: string
    secrets:
      NOTION_KEY:
        required: false
      FIREBASE_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authorize run
        env:
          GATE_SOURCE: ${{ inputs.source }}
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_APPLY: ${{ inputs.apply }}
          GATE_LIMIT: ${{ inputs.limit }}
          GATE_CONFIRMATION: ${{ inputs.confirmation }}
          GATE_ENVIRONMENT: ${{ inputs.environment }}
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          GATE_AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          GATE_MANUAL_APPLY_ENABLED: ${{ vars.AUTOMATION_MANUAL_APPLY_ENABLED }}
        run: node automation/ingestion/run-authorization.mjs authorize

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run publishing sync
        env:
          APPLY: ${{ inputs.apply }}
          LIMIT: ${{ inputs.limit }}
          RUN_ID: publish-${{ github.run_id }}-${{ github.run_attempt }}
          NOTION_KEY: ${{ secrets.NOTION_KEY }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          # Explicit Poster Library data source. The database now also contains
          # the Poster Identities data source, so the code refuses to guess when
          # this is absent.
          NOTION_POSTER_DATA_SOURCE_ID: ${{ vars.NOTION_POSTER_DATA_SOURCE_ID }}
          NOTION_POSTER_IDENTITIES_DATA_SOURCE_ID: ${{ vars.NOTION_POSTER_IDENTITIES_DATA_SOURCE_ID }}
          # Read-only in a dry-run: the CLI wraps the Firestore adapters in
          # proxies whose create/update/save methods throw. Apply runs are the
          # only path that reaches a real write.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          args=(--mode publish --run-id "$RUN_ID" --limit "$LIMIT" --summary-out artifacts/publish-summary.json)
          if [ "$APPLY" = "true" ]; then
            args+=(--apply --confirm-apply)
          fi
          npx tsx automation/ingestion/cli.ts "${args[@]}"

      - name: Publish execution summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f artifacts/publish-summary.json ]; then
            node -e '
              const s = require("./artifacts/publish-summary.json");
              const c = s.counts || {};
              const lines = [
                "## Notion publishing sync",
                "",
                `- Mode: ${s.dryRun ? "dry-run" : "apply"}`,
                `- Firestore state read: ${s.stateSource === "firestore" ? "yes" : "no (empty in-memory state)"}`,
                `- Published records discovered: ${c.publishedRecordsDiscovered ?? 0}`,
                `- Firestore records created: ${c.firestoreRecordsCreated ?? 0}`,
                `- Firestore records updated: ${c.firestoreRecordsUpdated ?? 0}`,
                `- Already synchronized: ${c.alreadySynchronized ?? 0}`,
                `- Needs review: ${c.needsReview ?? 0}`,
                `- Failed: ${c.failed ?? 0}`,
              ];
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            '
          else
            echo "No summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notion-publishing-summary
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
