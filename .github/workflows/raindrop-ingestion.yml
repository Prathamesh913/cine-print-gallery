name: Raindrop ingestion

# Three independent lanes:
#   - manual dry-run: always available, never writes, no activation variable;
#   - manual apply: requires AUTOMATION_MANUAL_APPLY_ENABLED, the confirmation
#     phrase, a limit of exactly 1 and the default branch. It intentionally does
#     not use a GitHub Environment reviewer: editorial approval happens once, in
#     Notion, when a Draft is moved to Published;
#   - scheduled apply: requires AUTOMATION_INGESTION_ENABLED and the schedule
#     event.
#
# Enabling AUTOMATION_INGESTION_ENABLED therefore arms only the ingestion cron
# lane. It never makes a manual dispatch writable, and it does not arm the
# publishing cron lane, which has its own AUTOMATION_PUBLISHING_ENABLED switch.
# Enabling the manual lane never arms cron.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "dry-run (read-only preview) or apply (production writes; requires confirmation)"
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      confirm_apply:
        description: "Required for apply: type APPLY-ONE-POSTER to authorize exactly one poster"
        type: string
        default: ""
      limit:
        description: "Maximum posters processed this run (apply requires exactly 1)"
        type: string
        default: "1"
      max_pages:
        description: "Maximum Raindrop pages fetched"
        type: string
        default: "4"

permissions:
  contents: read

concurrency:
  # Shared with the publishing sync: the two workflows must never overlap.
  # This does not protect against local CLI runs or other independent runners.
  group: cineprint-catalog-automation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate dispatch inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate manual authorization
        env:
          GATE_ACTION: ${{ inputs.action }}
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_LIMIT: ${{ inputs.limit }}
          GATE_MAX_PAGES: ${{ inputs.max_pages }}
          GATE_CONFIRMATION: ${{ inputs.confirm_apply }}
          GATE_REF: ${{ github.ref }}
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          GATE_MANUAL_APPLY_ENABLED: ${{ vars.AUTOMATION_MANUAL_APPLY_ENABLED }}
        run: node automation/ingestion/run-authorization.mjs dispatch

  manual-dry-run:
    name: Manual dry-run
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'dry-run'
    uses: ./.github/workflows/automation-ingest-run.yml
    with:
      apply: false
      limit: ${{ inputs.limit }}
      max-pages: ${{ inputs.max_pages }}
      source: manual
      confirmation: ""
    secrets:
      # Read-only credentials only: a dry-run must never need write access.
      RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      NOTION_KEY: ${{ secrets.NOTION_KEY }}

  manual-apply:
    name: Manual apply (one poster)
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'apply' &&
      vars.AUTOMATION_MANUAL_APPLY_ENABLED == 'true'
    uses: ./.github/workflows/automation-ingest-run.yml
    with:
      apply: true
      limit: ${{ inputs.limit }}
      max-pages: ${{ inputs.max_pages }}
      source: manual
      confirmation: ${{ inputs.confirm_apply }}
    secrets:
      RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      NOTION_KEY: ${{ secrets.NOTION_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  scheduled:
    name: Scheduled apply
    if: github.event_name == 'schedule' && vars.AUTOMATION_INGESTION_ENABLED == 'true'
    uses: ./.github/workflows/automation-ingest-run.yml
    with:
      apply: true
      limit: "10"
      max-pages: "4"
      source: schedule
      confirmation: ""
      scheduled-gate: AUTOMATION_INGESTION_ENABLED
      scheduled-enabled: ${{ vars.AUTOMATION_INGESTION_ENABLED }}
    secrets:
      RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      NOTION_KEY: ${{ secrets.NOTION_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
