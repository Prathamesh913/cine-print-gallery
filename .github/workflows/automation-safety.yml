name: Automation safety

# Narrowly scoped, read-only checks for the catalogue automation activation
# gates and their workflows. This workflow deliberately has:
#   - no production secrets or variables;
#   - no environment or deployment;
#   - no workflow_dispatch or pull_request_target;
#   - read-only GITHUB_TOKEN permissions.
#
# It only installs dependencies, runs local tests/lint, and downloads a pinned
# actionlint release with a checksum.

on:
  pull_request:
    paths:
      - "automation/ingestion/**"
      - "automation/notion/**"
      - "automation/repair/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "automation/ingestion/**"
      - "automation/notion/**"
      - "automation/repair/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: automation-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation-safety:
    name: Activation gates and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Authorization gate tests
        run: >-
          npx vitest run
          automation/ingestion/run-authorization.test.ts
          automation/ingestion/cli.test.ts
          automation/ingestion/workflows.test.ts
          automation/ingestion/notion-pages.test.ts
          automation/ingestion/config.test.ts

      - name: Ingestion regression tests
        run: npx vitest run automation/ingestion

      - name: Notion data-source regression tests
        run: npx vitest run automation/notion

      - name: Repair regression tests
        run: npx vitest run automation/repair

      - name: Lint automation sources
        run: npx eslint automation/ingestion automation/notion automation/repair

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 \
            -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Lint automation workflows
        # shellcheck is disabled because the job-summary steps deliberately
        # embed JavaScript in single-quoted shell strings.
        run: |
          "$RUNNER_TEMP/actionlint" -no-color -shellcheck= .github/workflows/*.yml
