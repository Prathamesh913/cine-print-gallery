name: Raindrop ingestion (run)

# Reusable run body. Callers own the activation gates and the environment.
# This workflow re-checks the resolved authorization before installing
# dependencies or exposing any credential to a step.

on:
  workflow_call:
    inputs:
      apply:
        description: "Perform external writes (authorized by the caller)"
        required: true
        type: boolean
      limit:
        description: "Maximum posters processed this run"
        required: true
        type: string
      max-pages:
        description: "Maximum Raindrop pages fetched"
        required: true
        type: string
      source:
        description: "manual or schedule"
        required: true
        type: string
      confirmation:
        description: "Manual apply confirmation phrase"
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub Environment that scopes this run"
        required: true
        type: string
    secrets:
      RAINDROP_ACCESS_TOKEN:
        required: false
      TMDB_API_KEY:
        required: false
      NOTION_KEY:
        required: false
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      FIREBASE_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authorize run
        env:
          GATE_SOURCE: ${{ inputs.source }}
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_APPLY: ${{ inputs.apply }}
          GATE_LIMIT: ${{ inputs.limit }}
          GATE_MAX_PAGES: ${{ inputs.max-pages }}
          GATE_CONFIRMATION: ${{ inputs.confirmation }}
          GATE_ENVIRONMENT: ${{ inputs.environment }}
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          GATE_AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          GATE_MANUAL_APPLY_ENABLED: ${{ vars.AUTOMATION_MANUAL_APPLY_ENABLED }}
        run: node automation/ingestion/run-authorization.mjs authorize

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ingestion
        env:
          APPLY: ${{ inputs.apply }}
          LIMIT: ${{ inputs.limit }}
          MAX_PAGES: ${{ inputs.max-pages }}
          RUN_ID: ingest-${{ github.run_id }}-${{ github.run_attempt }}
          RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
          RAINDROP_COLLECTION_ID: ${{ vars.RAINDROP_COLLECTION_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NOTION_KEY: ${{ secrets.NOTION_KEY }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          # Explicit Poster Library data source. The database also contains the
          # Poster Identities data source, so the client refuses to guess.
          NOTION_POSTER_DATA_SOURCE_ID: ${{ vars.NOTION_POSTER_DATA_SOURCE_ID }}
          # Write credentials are only injected for apply runs. A dry-run must
          # remain startable without any production write credential, which
          # also means R2 repository variables stay empty for dry-runs.
          R2_ACCOUNT_ID: ${{ inputs.apply && secrets.R2_ACCOUNT_ID || '' }}
          R2_ACCESS_KEY_ID: ${{ inputs.apply && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ inputs.apply && secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_BUCKET_NAME: ${{ inputs.apply && vars.R2_BUCKET_NAME || '' }}
          R2_PUBLIC_BASE_URL: ${{ inputs.apply && vars.R2_PUBLIC_BASE_URL || '' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ inputs.apply && secrets.FIREBASE_SERVICE_ACCOUNT_JSON || '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          args=(--mode ingest --run-id "$RUN_ID" --limit "$LIMIT" --max-pages "$MAX_PAGES" --summary-out artifacts/ingest-summary.json)
          if [ "$APPLY" = "true" ]; then
            args+=(--apply --confirm-apply)
          fi
          npx tsx automation/ingestion/cli.ts "${args[@]}"

      - name: Publish execution summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f artifacts/ingest-summary.json ]; then
            node -e '
              const s = require("./artifacts/ingest-summary.json");
              const c = s.counts || {};
              const lines = [
                "## Raindrop ingestion",
                "",
                `- Mode: ${s.dryRun ? "dry-run" : "apply"}`,
                `- Bookmarks discovered: ${c.bookmarksDiscovered ?? 0}`,
                `- Already processed: ${c.alreadyProcessed ?? 0}`,
                `- New candidates: ${c.newCandidates ?? 0}`,
                `- TMDB matches: ${c.tmdbMatches ?? 0}`,
                `- Needs review: ${c.needsReview ?? 0}`,
                `- R2 uploads verified: ${c.uploadsVerified ?? 0}`,
                `- Notion Drafts created: ${c.notionDraftsCreated ?? 0}`,
                `- Notion Drafts updated: ${c.notionDraftsUpdated ?? 0}`,
                `- Failed: ${c.failed ?? 0}`,
              ];
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            '
          else
            echo "No summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raindrop-ingestion-summary
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
